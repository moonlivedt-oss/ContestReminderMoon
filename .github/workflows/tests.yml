name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    # Приложение только для Windows (Windows OCR, реестр, WinAPI), поэтому
    # тесты идут на Windows-раннере. Qt - в offscreen-режиме, без экрана.
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest ruff
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest -q
      - name: JavaScript (userscript) syntax
        run: node --check browser/contestreminder.user.js
      - name: PowerShell (cr.ps1) syntax
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/tools/cr.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }
