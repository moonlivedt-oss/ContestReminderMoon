[project]
name = "contestreminder"
version = "1.2.0"
description = "Трей-напоминалка о конкурсах: автозапись из буфера обмена и OCR экрана, напоминания по дедлайнам"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
dependencies = ["PyQt6", "mss", "winsdk", "Pillow"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["contestreminder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
