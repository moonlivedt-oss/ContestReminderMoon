name: release

# Автор публикует релиз (gh release create vX.Y.Z), workflow собирает
# ContestReminder.exe, проверяет его самопроверкой и прикладывает к релизу.
# Для уже опубликованного релиза - запуск вручную с тегом.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза, например v1.2.1"
        required: true

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"     # под него есть winsdk (Windows OCR)
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build C++ part (crnative.exe)
        shell: cmd
        run: call native\build.cmd
      - name: Build exe
        run: pyinstaller ContestReminder.spec --noconfirm --clean
      - name: Self-test of the exe
        shell: pwsh
        run: |
          $report = "$env:RUNNER_TEMP\selftest.txt"
          $p = Start-Process dist\ContestReminder.exe -ArgumentList "--selftest", $report -Wait -PassThru
          Get-Content $report -Encoding UTF8
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: SHA256
        shell: pwsh
        run: (Get-FileHash dist\ContestReminder.exe -Algorithm SHA256).Hash | Out-File -Encoding ascii dist\ContestReminder.exe.sha256
      - name: Attach to release
        shell: pwsh
        run: gh release upload $env:TAG dist\ContestReminder.exe dist\ContestReminder.exe.sha256 --clobber
